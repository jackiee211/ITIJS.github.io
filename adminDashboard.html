<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./bootstrap-5.3.3-dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Admin Dashboard</title>
</head>
<body style="background-color: rgb(201, 199, 199);">
    <div class="container mt-5">
        <div class="text-center">
            <h1><b>Admin Dashboard</b></h1>
            <button class="btn btn-primary mb-5 mt-5 mx-5 btn-lg" id="showBtn">Show Products</button>
            <!-- Add Product Button -->
            <button class="btn btn-primary mb-5 mt-5 mx-5 btn-lg" id="addProductBtn">Add Product</button>
        </div>
        <div class="main row justify-content-center">
            <div class="col10 mb-5">
                <table class="table table-striped table-dark">
                  <thead>
                    <tr>
                      <th>Product ID</th>
                      <th>Product Picture</th>
                      <th>Product Name</th>
                      <th>Product Category</th>
                      <th>Product Price</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody class="prodList">
                    <!-- Product inserted here -->
                  </tbody>
                </table>
              </div>
        </div>
        <button class="btn btn-primary mb-5 mt-5 mx-5 btn-md" id="showOrdersBtn">Show Products</button>
        <span id="orderMsg"></span>
        <div class="main row justify-content-center mt-5">
            <div class="col10 mb-3">
                <table class="table table-striped table-dark">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Date</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable">
                        <!-- Orders will be dynamically addedd -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- Modal for Add/Edit Product -->
    <div class="modal fade" tabindex="-1" id="productModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitle"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="productForm">
              <div class="mb-3">
                <label for="productName" class="form-label">Product Name</label>
                <input type="text" class="form-control" id="productName" required>
              </div>
              <div class="mb-3">
                <label for="productCategory" class="form-label">Category</label>
                <input type="text" class="form-control" id="productCategory" required>
              </div>
              <div class="mb-3">
                <label for="productPrice" class="form-label">Price</label>
                <input type="number" class="form-control" id="productPrice" required>
              </div>
              <div class="mb-3">
                <label for="productImage" class="form-label">Image URL</label>
                <input type="url" class="form-control" id="productImage" required>
              </div>
              <button type="submit" class="btn btn-primary">Save Product</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <!-- ! Scripts -->
    <!-- <script src="scribt.js"></script> -->
    <script src="./JS/orderManagement.js"></script>
    <script src="./bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
