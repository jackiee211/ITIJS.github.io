<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./bootstrap-5.3.3-dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/index.css">
    <title>Login</title>
</head>
<body>
    <div class="forn-box rounded" >
        <h2 class="h2 text-center fs-1">LogIn</h2>
       <form action="" class="row p-3">

            <div class="col-12">
                <div class="form-data">
                   <input type="email" id="email" class="form-control my-2 p-2" placeholder="Email Address" />
                   <ul class="alert alert-danger p-0 invalid-feedback">
                      <li>Email Is Required</li>
                      <li>InValid Email Formate</li>
                   </ul>
                </div>
             </div>

             <div class="col-12">
                <div class="form-data">
                   <input type="password" id="password" class="form-control my-2 p-2" placeholder="Password" />
                   <ul class="alert alert-danger p-0 invalid-feedback">
                      <li>Password Is Required</li>
                      <li>Minimum eight characters, at least one letter and one number</li>
                   </ul>
                </div>
             </div>

             <div class="col-12">
                <button type="submit" class="btn w-100 main-btn login-btn" id="btnLogIn">LogIn</button>
                <p id="msg" class="text-center fw-bold text-danger mt-2"></p>
             </div>
             <div id="emailExist"></div>

             <footer class="text-center">
                <p class="fw-bold">You don't have Account <a href="registration.html">Register Now</a></p>
             </footer>

       </form>
    </div>
    <script src="./bootstrap-5.3.3-dist/js/bootstrap.bundle.js"></script>
    <script src="./JS/login.js"></script>
</body>
</html>
